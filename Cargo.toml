[workspace]
resolver = "2"
members = [
    "crates/denno-engine",
    "crates/denno-server",
    "crates/denno-cli",
    "crates/denno-telemetry",
    "crates/denno-view",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
