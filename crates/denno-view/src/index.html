<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>denno-trace viewer (P13 skeleton)</title>
<style>
  body { font-family: monospace; background: #14161a; color: #d7dae0; margin: 16px; }
  h1 { font-size: 16px; color: #9aa4b2; }
  h2 { font-size: 13px; color: #9aa4b2; border-bottom: 1px solid #2a2f38; margin-bottom: 4px; }
  .info { color: #79b8ff; }
  .bar-row { display: flex; align-items: center; margin: 1px 0; }
  .bar-label { width: 110px; color: #9aa4b2; }
  .bar-track { flex: 1; background: #22262d; height: 12px; }
  .bar-fill { height: 12px; background: #3fb950; }
  .bar-val { width: 80px; text-align: right; }
  table { border-collapse: collapse; font-size: 12px; }
  td, th { border: 1px solid #2a2f38; padding: 2px 8px; text-align: right; }
  th { color: #9aa4b2; }
  #tokens { max-height: 160px; overflow-y: auto; font-size: 12px; color: #a5d6ff; }
  .grid { display: flex; gap: 2px; flex-wrap: wrap; }
  .cell { width: 14px; height: 14px; background: #22262d; border: 1px solid #2a2f38; }
  .cell.busy { background: #d29922; }
  .cell.active { background: #3fb950; }
  .topk { font-size: 12px; }
  .topk .bar-track { max-width: 300px; height: 8px; }
  .topk .bar-fill { background: #58a6ff; }
  .warn { color: #f85149; }
  section { margin-bottom: 14px; }
</style>
</head>
<body>
<h1>denno-trace viewer <span class="info" id="server"></span> <span class="warn" id="gap"></span></h1>
<div id="status">connecting...</div>

<section>
  <h2>KV slots</h2>
  <div class="grid" id="kv"></div>
</section>

<section>
  <h2>op timing (last OpSummary, μs)</h2>
  <div id="ops"></div>
</section>

<section>
  <h2>sampler top-k</h2>
  <div class="topk" id="topk"></div>
</section>

<section>
  <h2>token stream</h2>
  <div id="tokens"></div>
</section>

<section>
  <h2>sessions</h2>
  <table id="sessions"><thead><tr><th>id</th><th>slot</th><th>prompt</th><th>out</th><th>state</th></tr></thead><tbody></tbody></table>
</section>

<script>
"use strict";
// denno-telemetry フレームの JS デコーダ (P13 骨組み。P14 で WASM 化)
const MAGIC = [0x44,0x4e,0x54,0x4c]; // "DNTL"
const K = { SERVER_INFO:1, SESSION_ADMIT:2, SESSION_DONE:3, PREFILL:4, TOKEN:5, STEP:6, OP_SUMMARY:7, KV_USAGE:8, GAP:9, TOP_K:10 };
const OP_NAMES = ["embed","rmsnorm","rope","qkv_proj","attn_core","o_proj","gate_up_proj","swiglu","down_proj","final_norm","lm_head","sampler","detok"];

function f16(h) {
  const s = (h & 0x8000) ? -1 : 1, e = (h >> 10) & 0x1f, m = h & 0x3ff;
  if (e === 0) return s * m * 2 ** -24;
  if (e === 31) return m ? NaN : s * Infinity;
  return s * (1 + m / 1024) * 2 ** (e - 15);
}
function decodeFrame(b) {
  if (b.length < 6 || MAGIC.some((v, i) => b[i] !== v)) throw "bad magic";
  const kind = b[5];
  let i = 6;
  const u32 = () => { let v = 0, sh = 0; for (;;) { const c = b[i++]; v |= (c & 0x7f) << sh; if (!(c & 0x80)) return v >>> 0; sh += 7; } };
  const u64 = () => { let v = 0n, sh = 0n; for (;;) { const c = b[i++]; v |= BigInt(c & 0x7f) << sh; if (!(c & 0x80)) return v; sh += 7n; } };
  const s = (n) => { const str = new TextDecoder().decode(b.slice(i, i + n)); i += n; return str; };
  switch (kind) {
    case K.SERVER_INFO: { const n = u32(); const model = s(n); const n2 = u32(); const quant = s(n2); return { t: "server", model, quant, slots: u32(), context: u32() }; }
    case K.SESSION_ADMIT: return { t: "admit", session: u32(), slot: u32(), prompt: u32() };
    case K.SESSION_DONE: { const session = u32(); const reason = b[i++]; return { t: "done", session, reason, out: u32() }; }
    case K.PREFILL: return { t: "prefill", session: u32(), prompt: u32(), ns: Number(u64()) };
    case K.TOKEN: return { t: "token", session: u32(), token: u32(), pos: u32() };
    case K.STEP: return { t: "step", width: u32(), ns: Number(u64()) };
    case K.OP_SUMMARY: { const n = u32(); const ops = []; for (let k = 0; k < n; k++) { const op = b[i++]; ops.push([op, Number(u64())]); } return { t: "ops", ops }; }
    case K.KV_USAGE: { const n = u32(); const busy = [], lens = []; for (let k = 0; k < n; k++) busy.push(b[i++] !== 0); for (let k = 0; k < n; k++) lens.push(u32()); return { t: "kv", busy, lens }; }
    case K.GAP: return { t: "gap", lost: u32() };
    case K.TOP_K: { const session = u32(); const chosen = u32(); const h = b[i] | (b[i+1] << 8); i += 2; const n = u32(); const entries = []; for (let k = 0; k < n; k++) { const id = u32(); const p = b[i] | (b[i+1] << 8); i += 2; entries.push([id, f16(p)]); } return { t: "topk", session, chosen, entropy: f16(h), entries }; }
    default: return { t: "unknown", kind };
  }
}

const sessions = new Map();
let totalGap = 0;

function renderKv(kv) {
  const el = document.getElementById("kv");
  el.innerHTML = "";
  kv.busy.forEach((busy, s) => {
    const c = document.createElement("div");
    c.className = "cell" + (busy ? " busy" : "");
    c.title = `slot ${s}: ${kv.lens[s]} tokens`;
    c.textContent = s;
    el.appendChild(c);
  });
}
function renderOps(ops) {
  const max = Math.max(...ops.ops.map(o => o[1]), 1);
  const el = document.getElementById("ops");
  el.innerHTML = ops.ops.map(([op, ns]) => {
    const name = OP_NAMES[op] || ("op" + op);
    const w = (ns / max * 100).toFixed(1);
    const us = (ns / 1000).toFixed(0);
    return `<div class="bar-row"><div class="bar-label">${name}</div><div class="bar-track"><div class="bar-fill" style="width:${w}%"></div></div><div class="bar-val">${us} μs</div></div>`;
  }).join("");
}
function renderTopK(topk) {
  const max = Math.max(...topk.entries.map(e => e[1]), 1e-9);
  document.getElementById("topk").innerHTML =
    `chosen: ${topk.chosen}, entropy: ${topk.entropy.toFixed(3)} nat<br>` +
    topk.entries.map(([id, p]) =>
      `<div class="bar-row"><div class="bar-label">tok ${id}</div><div class="bar-track"><div class="bar-fill" style="width:${(p / max * 100).toFixed(1)}%"></div></div><div class="bar-val">${(p * 100).toFixed(1)}%</div></div>`).join("");
}
function renderSessions() {
  const tb = document.querySelector("#sessions tbody");
  tb.innerHTML = [...sessions.entries()].map(([id, s]) =>
    `<tr><td>${id}</td><td>${s.slot ?? "-"}</td><td>${s.prompt ?? "-"}</td><td>${s.out ?? 0}</td><td>${s.state}</td></tr>`).join("");
}

function handle(f) {
  switch (f.t) {
    case "server":
      document.getElementById("server").textContent = `— ${f.model} (${f.quant}, slots=${f.slots}, ctx=${f.context})`;
      document.getElementById("status").textContent = "connected";
      break;
    case "admit":
      sessions.set(f.session, { slot: f.slot, prompt: f.prompt, out: 0, state: "running" });
      renderSessions();
      break;
    case "done": {
      const s = sessions.get(f.session) || {};
      s.state = ["end_turn", "max_tokens", "stop_seq", "error"][f.reason] || f.reason;
      s.out = f.out;
      sessions.set(f.session, s);
      renderSessions();
      break;
    }
    case "token": {
      const s = sessions.get(f.session) || { state: "running" };
      s.out = Math.max(s.out || 0, f.pos);
      sessions.set(f.session, s);
      renderSessions();
      const el = document.getElementById("tokens");
      const line = document.createElement("div");
      line.textContent = `s${f.session} pos${f.pos} tok ${f.token}`;
      el.prepend(line);
      while (el.childElementCount > 40) el.lastChild.remove();
      break;
    }
    case "kv": renderKv(f); break;
    case "ops": renderOps(f); break;
    case "topk": renderTopK(f); break;
    case "step": break; // タイムラインは P14
    case "prefill": break;
    case "gap":
      totalGap += f.lost;
      document.getElementById("gap").textContent = `gap: lost ${totalGap} frames`;
      break;
  }
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { document.getElementById("status").textContent = "waiting frames..."; };
  ws.onmessage = (ev) => {
    try { handle(decodeFrame(new Uint8Array(ev.data))); }
    catch (e) { console.warn("decode error", e); }
  };
  ws.onclose = () => {
    document.getElementById("status").textContent = "disconnected, retrying...";
    setTimeout(connect, 2000);
  };
}
connect();
</script>
</body>
</html>
