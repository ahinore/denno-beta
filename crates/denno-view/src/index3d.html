(function () {
  var box = document.getElementById('err'), shown = 0;
  function show(msg) {
    shown++; box.style.display = 'block';
    box.textContent += (shown === 1 ? '' : '\n') + String(msg).slice(0, 600);
  }
  window.addEventListener('error', function (e) {
    if (e.target && e.target.tagName === 'SCRIPT') show('script load failed: ' + (e.target.src || ''));
    else show((e.message || 'error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    show('promise rejected: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  setTimeout(function () { if (!window.__viewReady) show('no frame rendered after 4s'); }, 4000);

<script type="importmap">
{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/addons/" } }

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---- model shape (Qwen3.8-Flash-Next) -----------------------------------
const Q = new URLSearchParams(location.search);
const LAYERS  = 48;
const EXPERTS = 512;             // 1 層あたりの routed expert 数
const TOPK    = 10;              // decode で選ばれる expert 数
const ECOL    = 32, EROW = EXPERTS / ECOL;
const ZSTEP   = 2.8;
const EBOX    = 0.075;           // expert の箱

// 置き場 (上から VRAM / RAM / SSD)。expert はここを昇降する。
const TIER = { SSD: 0, RAM: 1, VRAM: 2 };
const TIER_Y = [-5.0, 0, 5.0];
const TIER_COLOR = [
  new THREE.Color('#ff3b6b'),   // SSD
  new THREE.Color('#ffb020'),   // RAM
  new THREE.Color('#00eaff')    // VRAM
];

// 役割ごとの色と形
const ROLE = {
  attn:   { color: new THREE.Color('#b46bff'), geo: [0.45, 1.8, 1.1], x: -5.9 },
  gdn:    { color: new THREE.Color('#00d9a0'), geo: [0.34, 1.2, 1.1], x: -5.0 },
  router: { color: new THREE.Color('#ffe14d'), geo: null,             x: -4.1 }, // octahedron
  shex:   { color: new THREE.Color('#ff2bd6'), geo: [0.34, 1.3, 1.1], x:  3.6 },
  ple:    { color: new THREE.Color('#7f8bff'), geo: [0.13, 2.2, 1.1], x:  4.3 }
};

// ---- renderer -----------------------------------------------------------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, preserveDrawingBuffer:true,
                                           powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#04060b');
scene.fog = new THREE.FogExp2('#04060b', 0.0072);

const totalZ = (LAYERS - 1) * ZSTEP;
const center = new THREE.Vector3(0, 0, -totalZ / 2);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 800);
camera.position.set(20, 21, 21);
camera.lookAt(center);

const controls = new OrbitControls(camera, canvas);
controls.target.copy(center);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.autoRotate = true; controls.autoRotateSpeed = 0.45;
controls.minDistance = 10; controls.maxDistance = 320;

// ---- tier platforms + labels -------------------------------------------
function tierGrid(y, color) {
  const g = new THREE.BufferGeometry();
  const pts = [];
  const x0 = -8, x1 = 6.4, z0 = 3, z1 = -totalZ - 3;
  for (let x = x0; x <= x1 + 0.001; x += (x1 - x0) / 14) pts.push(x, 0, z0, x, 0, z1);
  for (let z = z0; z >= z1 - 0.001; z -= (z0 - z1) / 48) pts.push(x0, 0, z, x1, 0, z);
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const m = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.16,
                                          blending: THREE.AdditiveBlending, depthWrite: false });
  const l = new THREE.LineSegments(g, m);
  l.position.y = y;
  return l;
}
scene.add(tierGrid(TIER_Y[TIER.SSD], 0x5a1226));
scene.add(tierGrid(TIER_Y[TIER.RAM], 0x4a3a10));
scene.add(tierGrid(TIER_Y[TIER.VRAM], 0x0d4a58));

function textSprite(txt, color, scale) {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 64;
  const g = cv.getContext('2d');
  g.font = 'bold 40px ui-monospace, monospace';
  g.fillStyle = color; g.textAlign = 'left'; g.textBaseline = 'middle';
  g.fillText(txt, 4, 34);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, opacity: 0.9 }));
  sp.scale.set(scale, scale / 4, 1);
  return sp;
}
[['VRAM', '#00eaff', TIER.VRAM], ['RAM', '#ffb020', TIER.RAM], ['SSD', '#ff3b6b', TIER.SSD]]
  .forEach(([name, col, tier]) => {
    const sp = textSprite(name, col, 2.6);
    sp.position.set(7.2, TIER_Y[tier], 2.6);
    scene.add(sp);
  });

// ---- layer frames (層の板) ---------------------------------------------
const frameW = 13.0, frameH = 12.0;
const frameGeo = new THREE.BufferGeometry();
frameGeo.setAttribute('position', new THREE.Float32BufferAttribute([
  -frameW/2,-frameH/2,0,  frameW/2,-frameH/2,0,
   frameW/2,-frameH/2,0,  frameW/2, frameH/2,0,
   frameW/2, frameH/2,0, -frameW/2, frameH/2,0,
  -frameW/2, frameH/2,0, -frameW/2,-frameH/2,0
], 3));
const layerLabels = [];
for (let L = 0; L < LAYERS; L++) {
  const major = L % 4 === 0 || L === LAYERS - 1;
  const mat = new THREE.LineBasicMaterial({
    color: major ? 0x1f8ea6 : 0x0a2b35, transparent: true,
    opacity: major ? 0.5 : 0.22, blending: THREE.AdditiveBlending, depthWrite: false
  });
  const f = new THREE.LineSegments(frameGeo, mat);
  f.position.z = -L * ZSTEP;
  scene.add(f);
}
for (let L = 0; L < LAYERS; L += 4) {
  const sp = textSprite('L' + String(L).padStart(2, '0'), '#3fd6ea', 1.5);
  sp.position.set(-frameW/2 - 1.1, 5.0, -L * ZSTEP);
  scene.add(sp);
}

// ---- experts (per layer InstancedMesh) ---------------------------------
const expertGeo = new THREE.BoxGeometry(EBOX, EBOX, EBOX);
const expertMat = new THREE.MeshBasicMaterial({ color: 0xffffff, fog: true });
const slabs = [];
const m4 = new THREE.Matrix4();

for (let L = 0; L < LAYERS; L++) {
  const inst = new THREE.InstancedMesh(expertGeo, expertMat.clone(), EXPERTS);
  inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const pos = new Float32Array(EXPERTS * 3);     // 現在の実座標 (x, z は固定)
  const xz = new Float32Array(EXPERTS * 2);
  for (let k = 0; k < EXPERTS; k++) {
    const cx = k % ECOL, cy = (k / ECOL) | 0;
    const x = -1.8 + cx * (4.6 / (ECOL - 1));
    const z = -L * ZSTEP - 0.40 + cy * (0.80 / (EROW - 1));
    xz[k*2] = x; xz[k*2+1] = z;
    pos[k*3] = x; pos[k*3+1] = TIER_Y[0]; pos[k*3+2] = z;
    m4.makeTranslation(x, TIER_Y[0], z);
    inst.setMatrixAt(k, m4);
    inst.setColorAt(k, new THREE.Color(0x0a1016));
  }
  inst.instanceMatrix.needsUpdate = true;
  inst.instanceColor.needsUpdate = true;
  inst.frustumCulled = false;
  scene.add(inst);
  slabs.push({
    inst, pos, xz, n: EXPERTS,
    tier: new Uint8Array(EXPERTS),               // 全員 SSD から開始
    act: new Float32Array(EXPERTS),
    color: new Float32Array(EXPERTS * 3),
    dirty: new Uint8Array(EXPERTS)
  });
}

// ---- 役割ブロック (attn / gdn / router / shared / ple) ------------------
const roleBlocks = {};
for (const [name, def] of Object.entries(ROLE)) {
  const geo = def.geo ? new THREE.BoxGeometry(def.geo[0], def.geo[1], def.geo[2])
                      : new THREE.OctahedronGeometry(0.34, 0);
  const inst = new THREE.InstancedMesh(geo, new THREE.MeshBasicMaterial({ color: 0xffffff, fog: true }), LAYERS);
  inst.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  for (let L = 0; L < LAYERS; L++) {
    m4.makeTranslation(def.x, 0, -L * ZSTEP);
    inst.setMatrixAt(L, m4);
    inst.setColorAt(L, def.color.clone().multiplyScalar(0.12));
  }
  inst.instanceMatrix.needsUpdate = true;
  inst.instanceColor.needsUpdate = true;
  inst.frustumCulled = false;
  scene.add(inst);
  roleBlocks[name] = { inst, def };
}

// ---- flow particles (層間) ---------------------------------------------
const PER_PAIR = 5;
const PARTICLES = (LAYERS - 1) * PER_PAIR;
const flowGeo = new THREE.BufferGeometry();
const flowPos = new Float32Array(PARTICLES * 3);
const flowCol = new Float32Array(PARTICLES * 3);
flowGeo.setAttribute('position', new THREE.BufferAttribute(flowPos, 3));
flowGeo.setAttribute('color', new THREE.BufferAttribute(flowCol, 3));
const dotTex = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.35, 'rgba(190,255,255,0.5)');
  grd.addColorStop(1, 'rgba(0,180,220,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const flow = new THREE.Points(flowGeo, new THREE.PointsMaterial({
  size: 1.1, map: dotTex, vertexColors: true, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true, fog: true
}));
flow.frustumCulled = false;
scene.add(flow);

// ---- postprocessing -----------------------------------------------------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.8, 0.42, 0.26);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---- state --------------------------------------------------------------
const demo = { on: true, t: 0, speed: 1.0, wave: 6.0 };
const live = { ts: 0, hit: new Map(), role: new Map() };
const cTmp = new THREE.Color(), cTier = new THREE.Color();

function tierCounts() {
  let v = 0, r = 0, d = 0;
  for (const s of slabs) for (let k = 0; k < s.n; k++) {
    if (s.tier[k] === TIER.VRAM) v++; else if (s.tier[k] === TIER.RAM) r++; else d++;
  }
  return [v, r, d];
}

// 層の活性 (0..1)
function layerHead(L) {
  if (demo.on) {
    const span = LAYERS + demo.wave * 2;
    const c = (demo.t * demo.speed) % span - demo.wave;
    const d = L - c;
    return Math.exp(-(d * d) / (2 * demo.wave * demo.wave)) * (0.80 + 0.20 * Math.sin(demo.t * 1.6 + L * 0.7));
  }
  const age = performance.now() - live.ts;
  return (live.hit.get(L) || 0) * Math.exp(-age / 500) + 0.08 * Math.exp(-age / 1600);
}

// expert の昇降 (活性の高い層の expert を VRAM へ、冷えたら RAM -> SSD へ)
const promote = [];
function updateResidency(L, head, tick) {
  const s = slabs[L];
  if (head < 0.05) {
    // 冷えた層: VRAM -> RAM -> SSD と落とす (1 tick に 1 段)
    if (tick % 12 === L % 12) {
      for (let k = 0; k < s.n; k++) {
        if (s.tier[k] > TIER.SSD) { s.tier[k]--; s.dirty[k] = 1; }
      }
    }
    return;
  }
  // 活性の高い層: 上位 expert を VRAM へ
  if (tick % 3 !== L % 3) return;
  promote.length = 0;
  for (let k = 0; k < s.n; k++) promote.push(k);
  promote.sort((p, q) => s.act[q] - s.act[p]);
  const want = Math.round(head * 220);
  for (let i = 0; i < s.n; i++) {
    const k = promote[i];
    const target = i < want ? TIER.VRAM : (i < want * 2 ? TIER.RAM : TIER.SSD);
    if (s.tier[k] !== target) { s.tier[k] = target; s.dirty[k] = 1; }
  }
}

function updateLayer(L, tick) {
  const s = slabs[L], n = s.n;
  const head = layerHead(L);

  // expert の活性 (top-K が光る。位置は層の中で固定、強さだけ変わる)
  for (let k = 0; k < n; k++) {
    const r = Math.sin(k * 12.9898 + L * 78.233) * 43758.5453;
    const rnd = r - Math.floor(r);
    const lit = rnd > 0.86 ? 1.0 : 0.10;
    const flick = 0.7 + 0.3 * Math.sin(demo.t * 3.0 + k * 0.7 + L);
    const a = Math.min(1, head * lit * flick);
    s.act[k] += (a - s.act[k]) * 0.30;
  }
  updateResidency(L, head, tick);

  // 色: 置き場の色 x 活性。VRAM にあるものは明るく。
  const col = s.inst.instanceColor.array;
  for (let k = 0; k < n; k++) {
    const a = s.act[k];
    cTier.copy(TIER_COLOR[s.tier[k]]);
    const base = s.tier[k] === TIER.VRAM ? 0.34 : (s.tier[k] === TIER.RAM ? 0.22 : 0.11);
    cTmp.copy(cTier).multiplyScalar(base + a * 1.5);
    if (a > 0.75) cTmp.lerp(new THREE.Color('#ffffff'), (a - 0.75) * 1.2);
    col[k*3] = cTmp.r; col[k*3+1] = cTmp.g; col[k*3+2] = cTmp.b;
  }
  s.inst.instanceColor.needsUpdate = true;

  // 位置: 置き場が変わった箱だけ行列を書き換える
  let changed = false;
  for (let k = 0; k < n; k++) {
    if (!s.dirty[k]) continue;
    const y = TIER_Y[s.tier[k]];
    m4.makeTranslation(s.xz[k*2], y, s.xz[k*2+1]);
    s.inst.setMatrixAt(k, m4);
    s.pos[k*3+1] = y;
    s.dirty[k] = 0;
    changed = true;
  }
  if (changed) s.inst.instanceMatrix.needsUpdate = true;

  // 役割ブロックの点灯: attn と gdn は層の活性、router は活性 + パルス
  const roles = demo.on
    ? { attn: head, gdn: head * 0.85, router: Math.min(1, head * 1.4), shex: head * 0.7, ple: head * 0.5 }
    : (live.role.get(L) || {});
  for (const [name, def] of Object.entries(ROLE)) {
    const v = Math.min(1, (roles[name] || 0) * 1.1);
    cTmp.copy(def.color).multiplyScalar(0.16 + v * 1.5);
    if (v > 0.8) cTmp.lerp(new THREE.Color('#ffffff'), (v - 0.8) * 1.5);
    roleBlocks[name].inst.setColorAt(L, cTmp);
  }
}

function updateRoleColorsDirty() {
  for (const name of Object.keys(ROLE)) roleBlocks[name].inst.instanceColor.needsUpdate = true;
}

const orderBuf = [];
function updateFlow(t) {
  let n = 0;
  for (let L = 0; L < LAYERS - 1; L++) {
    const a = slabs[L], b = slabs[L + 1];
    orderBuf.length = 0;
    for (let k = 0; k < a.n; k++) if (a.tier[k] === TIER.VRAM) orderBuf.push(k);
    if (orderBuf.length < PER_PAIR) { for (let k = 0; k < a.n && orderBuf.length < PER_PAIR; k++) orderBuf.push(k); }
    for (let i = 0; i < PER_PAIR; i++) {
      const k1 = orderBuf[i % orderBuf.length];
      const k2 = orderBuf[(i * 7) % orderBuf.length];
      const w = Math.min(1, a.act[k1] * 0.9 + b.act[k2] * 0.6);
      const ph = (t * 0.8 + i * 0.29 + L * 0.13) % 1;
      const o = n * 3;
      flowPos[o]   = a.pos[k1*3]   + (b.pos[k2*3]   - a.pos[k1*3])   * ph;
      flowPos[o+1] = a.pos[k1*3+1] + (b.pos[k2*3+1] - a.pos[k1*3+1]) * ph;
      flowPos[o+2] = a.pos[k1*3+2] + (b.pos[k2*3+2] - a.pos[k1*3+2]) * ph;
      const fade = Math.sin(Math.PI * ph) * Math.min(1, w * 1.5 + 0.2);
      flowCol[o] = 0.1 * fade; flowCol[o+1] = 0.9 * fade; flowCol[o+2] = 1.0 * fade;
      n++;
    }
  }
  flowGeo.attributes.position.needsUpdate = true;
  flowGeo.attributes.color.needsUpdate = true;
}

// ---- telemetry hooks (task 54/55 で接続) --------------------------------
window.onLayerActivation = function (layer, idx, val) {   // LayerAct
  demo.on = false;
  live.ts = performance.now();
  let sum = 0;
  for (let i = 0; i < idx.length; i++) sum += val[i];
  live.hit.set(layer, idx.length ? sum / idx.length : 0);
  document.getElementById('mode').textContent = 'mode: live (layer ' + layer + ')';
};
window.onRoleActivation = function (layer, roles) {        // RoleAct { attn, gdn, router, shex, ple }
  demo.on = false;
  live.ts = performance.now();
  live.role.set(layer, roles);
};
window.onResidency = function (layer, vramIdx) {           // VRAM に居る expert の index 列
  const s = slabs[layer]; if (!s) return;
  const inVram = new Set(vramIdx);
  for (let k = 0; k < s.n; k++) {
    const want = inVram.has(k) ? TIER.VRAM : (s.tier[k] === TIER.VRAM ? TIER.RAM : s.tier[k]);
    if (s.tier[k] !== want) { s.tier[k] = want; s.dirty[k] = 1; }
  }
};

// ---- loop ---------------------------------------------------------------
const clock = new THREE.Clock();
let acc = 0, cnt = 0, tick = 0, frameNo = 0;
function step(dt) {
  if (demo.on) demo.t += dt;
  tick++;
  for (let L = 0; L < LAYERS; L++) updateLayer(L, tick);
  updateRoleColorsDirty();
  updateFlow(demo.t);
  controls.update();
  composer.render();
}
function hud() {
  const [v, r, d] = tierCounts();
  document.getElementById('n_vram').textContent = v;
  document.getElementById('n_ram').textContent = r;
  document.getElementById('n_ssd').textContent = d;
}
function frame() {
  const dt = Math.min(0.06, clock.getDelta());
  step(dt);
  window.__viewReady = true;
  acc += dt; cnt++;
  if (acc > 0.4) { document.getElementById('fps').textContent = (cnt / acc).toFixed(0); hud(); acc = 0; cnt = 0; }
  requestAnimationFrame(frame);
}

if (Q.get('shot')) {
  const steps = parseInt(Q.get('steps') || '150', 10);
  let i = 0;
  const t = () => {
    step(1 / 60);
    if (++i < steps) return requestAnimationFrame(t);
    window.__viewReady = true;
    hud();
    document.getElementById('fps').textContent = 'shot';
    document.getElementById('dump').textContent = canvas.toDataURL('image/png');
  };
  requestAnimationFrame(t);
} else {
  frame();
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false);
  composer.setSize(innerWidth, innerHeight);
});
</script>
