[package]
name = "denno-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "denno"
path = "src/main.rs"

[dependencies]
denno-engine = { path = "../denno-engine" }
denno-server = { path = "../denno-server" }
denno-telemetry = { path = "../denno-telemetry" }
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "2"
# task 119b: serve_flash 起動時の rayon 大域プールの既定スレッド数
# (RAYON_NUM_THREADS 未設定のとき論理 CPU - 2)。
rayon = "1"

[dev-dependencies]
# P51: 実クライアント (denno-view が使うのと同じ tokio-tungstenite) での
# WebSocket 相互運用テスト用。どちらも workspace の Cargo.lock に既にある。
tokio-tungstenite = "0.23"
futures-util = "0.3"
