[package]
name = "denno-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
denno-telemetry = { path = "../denno-telemetry" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokenizers = "0.21"
safetensors = "0.4"
memmap2 = "0.9"
half = "2"
matrixmultiply = "0.3"
rayon = "1"
minijinja = { version = "2", features = ["json"] }
# HF chat template 互換 (Python 風 str メソッド: startswith/lstrip/rstrip/split 等)。
# Qwen3 の chat template がこれらを使うため必須。
minijinja-contrib = { version = "2", features = ["pycompat"] }
rand = "0.8"

[features]
# GEMV の行方向を rayon で並列化する (既定で有効)。行は独立なので数値は変わらない。
# A/B 計測のために切れるようにしてある。
default = ["par"]
par = []
# テスト用ユーティリティ (ダミーモデル/ダミートークナイザ) を公開する。
# denno-server の統合テストがモデルDLなしで Engine を構築できるようにするためのもの。
test-utils = []
# P17: CUDA int8 オフロード (denno-engine/src/cuda.rs)。依存ゼロ (dlopen ベース)。
# ビルドには kernels/kernels_int8.ptx (コミット済み) のみが必要で、libcuda は
# 実行時に解決される。GPU 無し環境では有効化しない。
cuda = []

[dev-dependencies]
# 統合テスト (tests/) から test-utils (ダミーモデル) を使うための自己参照。
denno-engine = { path = ".", features = ["test-utils"] }
# 統合テストが rayon のプールを明示して「スレッド数を変えても値が動かない」ことを
# 見るため (本体と同じ版を指す)。
rayon = "1"

# scripts/bench_all.sh 用のベンチ例は `denno_engine::cuda` を直接呼ぶので、
# cuda feature 無しの `cargo test -p denno-engine` でビルドしようとすると
# 未定義参照で落ちる。required-features で除外し、既定の test を緑に保つ。
[[example]]
name = "bench_q4_line"
required-features = ["cuda"]

[[example]]
name = "bench_gdn"
required-features = ["cuda"]
