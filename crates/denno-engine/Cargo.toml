[package]
name = "denno-engine"
version.workspace = true
edition.workspace = true

[dependencies]
denno-telemetry = { path = "../denno-telemetry" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokenizers = "0.21"
safetensors = "0.4"
memmap2 = "0.9"
half = "2"
matrixmultiply = "0.3"
rayon = "1"
minijinja = "2"
rand = "0.8"

[features]
# テスト用ユーティリティ (ダミーモデル/ダミートークナイザ) を公開する。
# denno-server の統合テストがモデルDLなしで Engine を構築できるようにするためのもの。
test-utils = []

[dev-dependencies]
# 統合テスト (tests/) から test-utils (ダミーモデル) を使うための自己参照。
denno-engine = { path = ".", features = ["test-utils"] }
