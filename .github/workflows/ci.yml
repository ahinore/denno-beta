name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # CI では target-cpu=native を使わない。rust-cache がランナー間で共有されるため、
  # 前回のランナーの CPU 用にネイティブビルドされた依存が別世代の CPU で
  # SIGILL (Illegal instruction) を起こすことがある。
  # x86-64-v3 (AVX2/FMA) は全ランナーが対応し、FMA を含むため
  # aarch64 で生成した exactness 基準との浮動小数点挙動も近い。
  RUSTFLAGS: "-C target-cpu=x86-64-v3"

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # native ビルドのキャッシュを無効化するためキーを変更
          key: ci-v3

      - name: Build (workspace, release)
        run: cargo build --workspace --release

      # モデルDLを要する exactness テストは #[ignore] 付きなので除外される
      - name: Test (workspace)
        run: cargo test --workspace

  exactness:
    # 実モデルを使った exactness 検証(Qwen2.5-0.5B をDLして基準出力と比較)
    # push時のみ実行(時間がかかるためPRでは省略)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-v3

      - name: Pull models
        run: |
          cargo run --release --bin denno -- pull Qwen/Qwen2.5-0.5B-Instruct
          cargo run --release --bin denno -- pull Qwen/Qwen3-0.6B

      - name: Run exactness tests (ignored)
        run: cargo test --release --workspace -- --ignored
